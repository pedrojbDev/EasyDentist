[project]
name = "easydentist-api"
version = "0.1.0"
description = "API FastAPI do EasyDentist"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.16.5",
  "argon2-cffi==25.1.0",
  "asyncpg==0.30.0",
  "fastapi==0.141.1",
  "sqlalchemy==2.0.44",
  "uvicorn[standard]==0.40.0",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "mypy==1.18.2",
  "pip-audit==2.9.0",
  "pytest==9.0.3",
  "ruff==0.14.10",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["app", "scripts"]
exclude = ["^tests/"]
strict = true
warn_unused_configs = true
