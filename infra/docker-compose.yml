name: easydentist

services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-easydentist}
      POSTGRES_USER: ${POSTGRES_USER:-easydentist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-easydentist-local-only}
    ports:
      - '127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.27.5
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'
    healthcheck:
      test: ['CMD-SHELL', 'wget --spider --quiet http://127.0.0.1:8025/livez']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  storage:
    image: chrislusf/seaweedfs:4.29
    command: server -s3 -dir=/data
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-easydentist}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-easydentist-local-only}
      S3_BUCKET: ${S3_BUCKET:-easydentist}
    ports:
      - '127.0.0.1:9000:8333'
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      # The S3 gateway is the service consumed by the applications. Its root
      # deliberately returns HTTP 403 only after the S3 handler is available.
      test:
        [
          'CMD-SHELL',
          'response=$$(wget -S -O /dev/null http://127.0.0.1:8333/ 2>&1 || true); printf "%s" "$$response" | grep -q "HTTP/1.1 403 Forbidden"',
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-easydentist}:${POSTGRES_PASSWORD:-easydentist-local-only}@db:5432/${POSTGRES_DB:-easydentist}
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
      S3_ENDPOINT_URL: http://storage:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-easydentist}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-easydentist-local-only}
    ports:
      - '127.0.0.1:8000:8000'
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      storage:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'python -c "from urllib.request import urlopen; urlopen(''http://127.0.0.1:8000/api/v1/health'').read()"',
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        API_INTERNAL_BASE_URL: http://api:8000
    environment:
      API_INTERNAL_BASE_URL: http://api:8000
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:3000/health'').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
  seaweedfs_data:
